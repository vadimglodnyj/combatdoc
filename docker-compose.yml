version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: combatdoc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: combatdoc
      POSTGRES_PASSWORD: combatdoc_dev
      POSTGRES_DB: combatdoc
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U combatdoc']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
