<div class="page-list">
  <div class="page-list__header">
    <h1>Військовослужбовці</h1>
    <button nz-button nzType="primary" (click)="openCreateModal()">
      <span nz-icon nzType="plus"></span>
      Додати
    </button>
  </div>

  <div class="page-list__filters">
    <nz-input-group [nzPrefix]="prefixIconSearch" class="page-list__search">
      <input
        type="text"
        nz-input
        placeholder="Пошук за ПІБ або телефоном"
        [(ngModel)]="searchValue"
        (keyup.enter)="onSearch()"
      />
    </nz-input-group>
    <button nz-button nzType="primary" (click)="onSearch()">
      <span nz-icon nzType="search"></span>
      Пошук
    </button>
  </div>

  <ng-template #prefixIconSearch>
    <span nz-icon nzType="search"></span>
  </ng-template>

  <nz-spin [nzSpinning]="loading">
    <nz-empty *ngIf="!loading && members.length === 0" nzNotFoundContent="Немає карток"></nz-empty>

    <p class="page-list__meta" *ngIf="!loading && total > 0">{{ total }} карток</p>

    <div class="tile-stack" *ngIf="members.length > 0">
      <article class="data-tile" *ngFor="let member of members" (click)="viewDetail(member)">
        <div class="data-tile__head">
          <h2 class="data-tile__title">{{ getFullName(member) }}</h2>
          <nz-space (click)="$event.stopPropagation()">
            <button *nzSpaceItem nz-button nzType="text" nzSize="small" (click)="openEditModal(member)">
              <span nz-icon nzType="edit"></span>
            </button>
            <button
              *nzSpaceItem
              nz-button
              nzType="text"
              nzSize="small"
              nzDanger
              nz-popconfirm
              nzPopconfirmTitle="Видалити цю картку?"
              (nzOnConfirm)="deleteMember(member)"
            >
              <span nz-icon nzType="delete"></span>
            </button>
          </nz-space>
        </div>

        <div class="data-tile__tags">
          <nz-tag
            *ngIf="member.episodes && member.episodes.length > 0"
            [nzColor]="getNatureColor(member.episodes[0].nature)"
          >
            {{ member.episodes[0].nature === 'COMBAT' ? 'Бойова' : 'Небойова' }}
          </nz-tag>
          <nz-tag *ngIf="!member.episodes || member.episodes.length === 0">В строю</nz-tag>
        </div>

        <dl class="field-list member-fields">
          <div class="field">
            <dt class="field__label">Звання</dt>
            <dd class="field__value">{{ member.rank?.name || '—' }}</dd>
          </div>
          <div class="field">
            <dt class="field__label">Підрозділ</dt>
            <dd class="field__value">{{ formatUnit(member) }}</dd>
          </div>
          <div class="field field--wide">
            <dt class="field__label">Посада</dt>
            <dd class="field__value">{{ member.fullPosition || '—' }}</dd>
          </div>
          <div class="field field--wide" *ngIf="member.phone">
            <dt class="field__label">Телефон</dt>
            <dd class="field__value">
              <a href="tel:{{ member.phone }}" (click)="$event.stopPropagation()">{{ member.phone }}</a>
            </dd>
          </div>
        </dl>
      </article>
    </div>

    <div class="page-list__pager" *ngIf="total > 20">
      <nz-pagination
        [nzPageIndex]="page"
        [nzPageSize]="pageSize"
        [nzTotal]="total"
        [nzShowSizeChanger]="true"
        [nzPageSizeOptions]="[20, 30, 50]"
        (nzPageIndexChange)="onPageIndexChange($event)"
        (nzPageSizeChange)="onPageSizeChange($event)"
      ></nz-pagination>
    </div>
  </nz-spin>
</div>
