<div class="page-list">
  <div class="page-list__header">
    <h1>Консультації</h1>
    <nz-input-group nzSearch [nzAddOnAfter]="suffix">
      <input
        type="text"
        nz-input
        placeholder="Пошук за ПІБ, діагнозом або ЛПЗ"
        [(ngModel)]="searchValue"
        (keyup.enter)="onSearch()"
      />
    </nz-input-group>
    <ng-template #suffix>
      <button nz-button nzType="primary" (click)="onSearch()">Пошук</button>
    </ng-template>
  </div>

  <nz-spin [nzSpinning]="loading">
    <p class="page-list__meta" *ngIf="!loading && total > 0">{{ total }} консультацій</p>
    <nz-empty *ngIf="!loading && items.length === 0" nzNotFoundContent="Немає консультацій"></nz-empty>

    <div class="tile-stack" *ngIf="items.length > 0">
      <article class="data-tile" *ngFor="let item of items" (click)="open(item)">
        <div class="data-tile__head">
          <h3 class="data-tile__title">
            {{ kindLabel(item.kind) }}
            <span *ngIf="item.facility?.shortName || item.facility?.name">
              · {{ item.facility?.shortName || item.facility?.name }}
            </span>
          </h3>
          <span class="data-tile__action">Епізод</span>
        </div>
        <div class="data-tile__tags">
          <nz-tag [nzColor]="statusColor(item.status)">{{ statusLabel(item.status) }}</nz-tag>
          <nz-tag *ngIf="item.episode?.diagnosis">{{ item.episode?.diagnosis }}</nz-tag>
        </div>
        <p class="data-tile__meta">
          {{ memberName(item) }} · {{ formatDate(item.completedDate || item.scheduledDate) }}
          <span *ngIf="item.notes"> · {{ item.notes }}</span>
        </p>
      </article>
    </div>

    <div class="page-list__pager" *ngIf="total > 20">
      <nz-pagination
        [nzPageIndex]="page"
        [nzPageSize]="pageSize"
        [nzTotal]="total"
        (nzPageIndexChange)="onPageIndexChange($event)"
      ></nz-pagination>
    </div>
  </nz-spin>
</div>
